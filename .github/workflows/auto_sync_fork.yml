# ============================================================================
# 🔄 Auto Sync Fork - 自动同步上游代码的终极守护脚本
# ============================================================================
# 💡 功能说明：
# 1. 每天定时自动执行，将原作者（上游）的最新更新合并到你的 Fork 仓库中。
# 2. 纯云端运行，不需要消耗你本地电脑的任何资源。
# 3. 如果原项目不幸被删库 404，此脚本只会报错停止，你仓库里的历史数据绝对安全！

name: 🔄 自动同步上游 (Auto Sync Fork)

# ----------------------------------------------------------------------------
# ⏰ 触发器 (Triggers)：告诉 GitHub 什么时候开始干活
# ----------------------------------------------------------------------------
on:
  # 🗓️ 定时任务触发
  schedule:
    # 使用 Cron 表达式 (格式: 分 时 日 月 星期)
    # ⚠️ 注意：这里使用的是 UTC 时间 (0点)。加上 8 小时时差，正好是北京时间每天早上 8:00
    - cron: '0 0 * * *'
  
  # 🔘 手动按钮触发
  # 加上这一行后，你的 GitHub Actions 页面会多出一个 "Run workflow" 按钮，可以随时手动补刷
  workflow_dispatch: 


# ----------------------------------------------------------------------------
# 🚀 任务流 (Jobs)：定义具体的执行步骤
# ----------------------------------------------------------------------------
jobs:
  sync-upstream:
    name: 🔄 拉取与同步任务
    runs-on: ubuntu-latest  # 💻 分配一台最新的 Ubuntu 虚拟机来跑脚本
    
    # 🔐 权限配置 (极其重要！)
    # 赋予此脚本修改你仓库代码的权限，否则同步操作会被拒绝
    permissions:
      contents: write
      
    steps:
      # 🛠️ 步骤 1：调用官方工具进行强力同步
      - name: 📥 执行同步命令 (gh repo sync)
        # 使用 GitHub 官方的 CLI 工具 (gh)。
        # ⚠️ 注意：这里指定的同步分支是 master。如果原仓库主分支叫 main，请将 master 改为 main！
        run: gh repo sync $GITHUB_REPOSITORY --branch master
        
        # 🔑 身份验证
        # 调用 GitHub 自动为你生成的内部秘钥，相当于给机器人发了一张通行证
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
